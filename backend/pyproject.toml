[project]
name = "agenttwinops-backend"
version = "0.1.0"
description = "Documentation-first scaffold for AgentTwinOps backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]",
  "redis",
  "pymongo",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

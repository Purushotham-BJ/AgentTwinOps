apiVersion: v1
kind: Secret
metadata:
  name: agenttwinops-secrets
  namespace: agenttwinops
type: Opaque
stringData:
  POSTGRES_USER: replace-me
  POSTGRES_PASSWORD: replace-me
  POSTGRES_DB: agenttwinops
  SECRET_KEY: replace-with-a-long-random-production-secret
  GOOGLE_CLIENT_ID: replace-with-google-client-id
  GOOGLE_CLIENT_SECRET: replace-with-google-client-secret
  GITHUB_CLIENT_ID: replace-with-github-client-id
  GITHUB_CLIENT_SECRET: replace-with-github-client-secret
  BACKEND_API_TOKEN: replace-with-backend-api-token
  BACKEND_SERVICE_EMAIL: replace-with-backend-service-email
  BACKEND_SERVICE_PASSWORD: replace-with-backend-service-password
  OPENAI_API_KEY: replace-with-openai-api-key
  ANTHROPIC_API_KEY: replace-with-anthropic-api-key

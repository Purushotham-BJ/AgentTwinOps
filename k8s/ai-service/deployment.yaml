apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: agenttwinops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: agenttwinops/ai-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: BACKEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: BACKEND_API_URL
            - name: AI_SERVICE_ENV
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: AI_SERVICE_ENV
            - name: AI_SERVICE_MODE
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: AI_SERVICE_MODE
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: AI_PROVIDER
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: GEMINI_MODEL
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: AI_MODEL
            - name: AI_TEMPERATURE
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: AI_TEMPERATURE
            - name: AI_MAX_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: AI_MAX_TOKENS
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: CORS_ORIGINS_AI
            - name: BACKEND_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agenttwinops-secrets
                  key: BACKEND_API_TOKEN
                  optional: true
            - name: BACKEND_SERVICE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: agenttwinops-secrets
                  key: BACKEND_SERVICE_EMAIL
                  optional: true
            - name: BACKEND_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenttwinops-secrets
                  key: BACKEND_SERVICE_PASSWORD
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agenttwinops-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agenttwinops-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agenttwinops-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: agenttwinops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: agenttwinops/ai-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: BACKEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: BACKEND_API_URL
            - name: AI_SERVICE_ENV
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: AI_SERVICE_ENV
            - name: AI_SERVICE_MODE
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: AI_SERVICE_MODE
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: agenttwinops-config
                  key: CORS_ORIGINS_AI
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20

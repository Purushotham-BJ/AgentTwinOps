apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenttwinops
  namespace: agenttwinops
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: agenttwinops.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /api/v1/agents
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8001
          - path: /api/v1/predict
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8001
          - path: /api/v1/simulate
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8001
          - path: /api/v1/recommendations
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

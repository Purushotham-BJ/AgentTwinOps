version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: agenttwinops-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: agenttwinops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenttwinops-backend
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:admin_password@postgres:5432/agenttwinops
      - JWT_SECRET_KEY=super-secret-key-123
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenttwinops-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_AI_API_BASE_URL=http://localhost:8001
      - VITE_APP_ENV=development
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agenttwinops-ai
    environment:
      - AI_SERVICE_ENV=development
      - BACKEND_API_URL=http://backend:8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - BACKEND_SERVICE_EMAIL=admin@agenttwinops.dev
      - BACKEND_SERVICE_PASSWORD=your_password_here
    ports:
      - "8001:8001"
    depends_on:
      - backend

volumes:
  postgres_data:

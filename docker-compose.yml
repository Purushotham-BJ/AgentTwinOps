version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: agenttwinops-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-agenttwinops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenttwinops-backend
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin_password}@postgres:5432/${POSTGRES_DB:-agenttwinops}
      - SECRET_KEY=${SECRET_KEY:-replace-with-a-long-random-local-secret}
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oauth/google/callback}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oauth/github/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenttwinops-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_AI_API_BASE_URL=http://localhost:8001
      - VITE_APP_ENV=development
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agenttwinops-ai
    environment:
      - AI_SERVICE_ENV=${AI_SERVICE_ENV:-development}
      - BACKEND_API_URL=http://backend:8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - BACKEND_SERVICE_EMAIL=${BACKEND_SERVICE_EMAIL:-}
      - BACKEND_SERVICE_PASSWORD=${BACKEND_SERVICE_PASSWORD:-}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.3}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-2000}
      - AI_SERVICE_MODE=${AI_SERVICE_MODE:-real}
    ports:
      - "8001:8001"
    depends_on:
      - backend

volumes:
  postgres_data:
